[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-kernel"
version = "0.1.0"
description = "Validate SEED evidence records (receipt, dispatch, experiment, handoff) against the schema/ contract. No third-party dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jonathan Simone" }]
keywords = ["research", "reproducibility", "agents", "evaluation", "pre-registration", "software-engineering", "json-schema"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Repository = "https://github.com/thisisntjon/seed-protocol"
Schemas = "https://github.com/thisisntjon/seed-protocol/tree/main/schema"

[project.scripts]
evidence-kernel = "evidence_kernel.cli:main"

[tool.setuptools]
packages = ["evidence_kernel"]

[tool.setuptools.package-data]
evidence_kernel = ["schemas/*.json"]
