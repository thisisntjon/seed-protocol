name: verify-seed

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/onboard_check.py
      - run: python scripts/schema_check.py
      - run: python -m unittest discover -s schema/tests
      - run: python scripts/sabotage_test.py
      - run: python scripts/poc_check.py
      - run: python workflow/blueprint/bin/selftest.py
      - run: python workflow/harvest/pack/assemble.py --check
      - run: python workflow/blueprint/bin/orient.py
